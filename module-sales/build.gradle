plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.company.module'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // SAP JCo — libs/ 폴더에 sapjco3.jar 파일 필요
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

// standalone 실행 가능한 fat JAR 생성
bootJar {
    enabled = true

    // libsapjco3.so를 JAR 안에 포함 (실행 시 추출하여 사용)
    from('libs') {
        include 'libsapjco3.so'
        into 'BOOT-INF/classes/native'
    }
}

jar {
    enabled = false
}

// 개발 시 bootRun에서 네이티브 라이브러리 경로 설정
bootRun {
    def libsDir = file("${projectDir}/libs").absolutePath
    jvmArgs = ["-Djava.library.path=${libsDir}"]
}
