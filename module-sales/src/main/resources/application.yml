# ──────────────────────────────────────────────
#  S&OP 생산계획 관리 시스템 — 독립 실행 설정
# ──────────────────────────────────────────────

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  # ── 정적 리소스 (프론트엔드 HTML/JS/CSS) ──
  # JAR 실행 위치 기준 상대경로 ./web/ 또는 환경변수로 절대경로 지정 가능
  web:
    resources:
      static-locations: file:${STATIC_PATH:./web/}
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true
      chain:
        strategy:
          content:
            enabled: false

  # ── 데이터소스 ──
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:snop_db}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER:snop_user}
    password: ${DB_PASS:snop_pass1234}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ──
  jpa:
    database-platform: org.hibernate.dialect.MariaDB103Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDB103Dialect

  # ── Jackson ──
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss

# ──────────────────────────────────────────────
#  SAP RFC 연결 설정
#  SAP 계정 정보를 환경변수 또는 여기에서 직접 수정하세요.
# ──────────────────────────────────────────────
sap:
  jco:
    host: ${SAP_HOST:10.2.14.210}
    system-number: ${SAP_SYSNR:1}
    client: ${SAP_CLIENT:100}
    user: ${SAP_USER:SNOP001}
    password: ${SAP_PASS:}
    language: ${SAP_LANG:KO}
    pool-capacity: 5
    peak-limit: 10

# ── 로깅 ──
logging:
  level:
    root: INFO
    com.company.module.sales: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
