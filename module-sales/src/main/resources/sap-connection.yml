# ──────────────────────────────────────────────
#  SAP RFC 연결 설정
#  이 파일에서 SAP 계정 정보를 직접 수정하세요.
# ──────────────────────────────────────────────
sap:
  jco:
    # SAP 서버 IP 또는 도메인
    host: 10.2.14.210

    # 시스템 번호 (System Number)
    system-number: "1"

    # 클라이언트 번호 (Client)
    client: "100"

    # RFC 접속 계정
    user: SNOP001

    # RFC 접속 비밀번호 (여기에 직접 입력하세요)
    password: ""

    # 접속 언어 (KO / EN)
    language: KO

    # ── 연결 풀 설정 (선택) ──
    # 최대 동시 연결 수
    pool-capacity: 5
    # 최대 대기 연결 수
    peak-limit: 10
